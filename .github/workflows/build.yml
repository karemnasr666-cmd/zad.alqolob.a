name: Build Zad Al Qolob APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project
        shell: bash
        run: |
          SCRIPT=$(find . -type f -name prepare_offline_data.py | head -n 1)

          if [ -z "$SCRIPT" ]; then
            echo "Project script not found"
            find . -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$SCRIPT")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Prepare offline data
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python3 scripts/prepare_offline_data.py

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zad-alqolob-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
